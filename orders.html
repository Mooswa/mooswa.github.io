<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mooswa | Encargos</title>
        <link rel="stylesheet" href="sources/styles/styles.css">
        <link rel="icon" type="image/png" href="sources/images/favicon.png">
        <script type="module">
            import emailjs from 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/+esm';
            window.emailjs = emailjs;
            emailjs.init("PQMcpg_IlfZb_5Qi2");
        </script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-0MYZS1WR58"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-0MYZS1WR58');
        </script>
    </head>
    <body>
        <input type="checkbox" id="light-dark">
        <header class="header">
            <img class="header__logo" src="sources/images/logo.png" alt="Mooswa logo">
            <div>
                <nav class="header__links links">
                    <a class="header__link link" href="/">Página principal</a>
                    <a class="header__link link" href="/info">¿Quiénes somos?</a>
                    <a class="header__link link" href="/purchases">Compras</a>
                    <a class="header__link link" href="/orders">Encargos</a>
				    <label class="header__toggle--light-dark-modes" for="light-dark"></label>
                </nav>
            </div>
        </header>
        <main class="main">
            <article class="main__article">
                <h1 class="article__title">Encargos</h1>
                <h2 class="article__subtitle">¡Realiza tu encargo personalizado aquí!</h2>
                <form class="article__form article__form--orders">
                    <section class="form__section form__section--personal-information">
                        <h3 class="form__heading heading">Datos personales</h3>
                        <div>
                            <input class="form__input form__input--name" id="name" type="text" name="name" placeholder="Nombre completo" required>
                        </div>
                        <div>
                            <input class="form__input form__input--email" id="email" type="email" name="email" placeholder="Correo electrónico" required>
                        </div>
                    </section>
                    <section class="form__section form__section--order-details">
                        <h3 class="form__heading heading">Detalles del encargo</h3>
                        <div>
                            <textarea class="form__textarea form__textarea--order-details" id="order-text" placeholder="Describe tu cuaderno ideal..." required></textarea>
                        </div>
                        <div>
                            Sube un archivo de referencia (opcional):<br>
                            <input class="form__input form__input--file-upload" type="file" id="file-upload" name="file-upload" accept=".jpg, .jpeg, .png, .pdf">
                        </div>
                    </section>
                    <button class="form__button form__button--send-request" id="send-request" type="button" onclick="sendOrderEmail()">Enviar pedido por correo electrónico →</button>
                </form>
            </article>
        </main>
        <footer class="footer">
            <p class="footer__copyright">© 2026 Mooswa. Todos los derechos reservados.</p>
            <nav class="footer__links links">
                <a class="footer__link link" href="mailto:steelhnos@gmail.com" target="_blank">
                    <img class="link__img" src="sources/images/email_icon.png" alt="Correo electrónico">
                    Correo electrónico
                </a>
                <a class="footer__link link" href="https://excelenciamooswa.blogspot.com" target="_blank">
                    <img class="link__img" src="sources/images/blogger_icon.png" alt="Blog">
                    Blog
                </a>
                <a class="footer__link link" href="https://instagram.com/mooswa_uy" target="_blank">
                    <img class="footer__link__img" src="sources/images/instagram_icon.png" alt="Instagram">
                    Instagram
                </a>
            </nav>
        </footer>
        <script src="sources/scripts/script.js"></script>
    </body>
</html>
