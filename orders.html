<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mooswa | Encargos</title>
        <link rel="stylesheet" href="sources/styles/styles.css">
        <link rel="icon" type="image/png" href="sources/images/favicon.png">
        <script type="module">
            import emailjs from 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/+esm';
            window.emailjs = emailjs;
            emailjs.init("PQMcpg_IlfZb_5Qi2");
        </script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-0MYZS1WR58"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-0MYZS1WR58');
        </script>
    </head>
    <body>
        <input type="checkbox" id="light-dark">
        <header>
            <img id="logo" src="sources/images/logo.png" alt="Mooswa logo">
            <div>
                <nav id="links">
                    <a href="/">Página principal</a>
                    <a href="/info">¿Quiénes somos?</a>
                    <a href="/purchases">Compras</a>
                    <a href="/orders">Encargos</a>
				    <label for="light-dark" class="light-dark-toggle"></label>
                </nav>
            </div>
        </header>
        <main>
            <article>
                <h1>Encargos</h1>
                <h2>¡Realiza tu encargo personalizado aquí!</h2>
                <form id="order-form">
                    <section class="form-section">
                        <h3>Datos personales</h3>
                        <div>
                            <input id="name" type="text" name="name" placeholder="Nombre completo" required>
                        </div>
                        <div>
                            <input id="email" type="email" name="email" placeholder="Correo electrónico" required>
                        </div>
                    </section>
                    <section class="form-section">
                        <h3>Detalles del encargo</h3>
                        <div>
                            <textarea id="order-text" class="form" placeholder="Describe tu cuaderno ideal..." required></textarea>
                        </div>
                        <div>
                            Sube un archivo de referencia (opcional):<br>
                            <input type="file" id="file-upload" name="file-upload" accept=".jpg, .jpeg, .png, .pdf">
                        </div>
                    </section>
                    <button id="send-request" type="button" onclick="sendOrderEmail()">Enviar pedido por correo electrónico →</button>
                </form>
            </article>
        </main>
        <footer>
            <p id="copyright">© 2026 Mooswa. Todos los derechos reservados.</p>
            <nav id="contact-links">
                <a href="mailto:steelhnos@gmail.com" target="_blank">
                    <img src="sources/images/email_icon.png" alt="Correo electrónico">
                    Correo electrónico
                </a>
                <a href="https://excelenciamooswa.blogspot.com" target="_blank">
                    <img src="sources/images/blogger_icon.png" alt="Blog">
                    Blog
                </a>
                <a href="https://instagram.com/mooswa_uy" target="_blank">
                    <img src="sources/images/instagram_icon.png" alt="Instagram">
                    Instagram
                </a>
            </nav>
        </footer>
        <script src="sources/scripts/script.js"></script>
    </body>
</html>
